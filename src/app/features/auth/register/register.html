<div class="login-container">

    <div class="login-card">

        <h1>Crear cuenta</h1>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <input type="text" placeholder="Usuario" formControlName="username">

            <input type="password" placeholder="Contraseña" formControlName="password">

            <input type="password" placeholder="Repetir contraseña" formControlName="confirmPassword">

            <button type="submit" [disabled]="loading">
                @if (loading) {
                Creando cuenta...
                } @else {
                Registrarse
                }
            </button>

            @if (errorMessage) {
            <p class="error">{{ errorMessage }}</p>
            }

        </form>

        <p class="register-link">
            ¿Ya tienes cuenta?
            <a routerLink="/login">Iniciar sesión</a>
        </p>

    </div>

</div>
